name: iOS Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Shared iOS Tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: List Gradle tasks
        run: ./gradlew tasks

      - name: Run Tests
        run: ./gradlew test

      - name: Build iOS App
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            build
