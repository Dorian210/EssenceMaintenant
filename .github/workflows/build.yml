name: KMP Build & Test

on:
  push:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Gradle and Environment
        uses: ./.github/actions/gradle-setup
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # --- ÉTAPE 1 : TESTS UNITAIRES ---
      - name: Run Android & Common Tests
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :shared:testDebugUnitTest

      - name: Run iOS Tests
        if: matrix.os == 'macos-latest'
        run: ./gradlew :shared:iosTest

      # --- ÉTAPE 2 : COMPILATION BRUTE ---
      - name: Build Android APK
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :androidApp:assembleDebug

      - name: Build iOS Framework
        if: matrix.os == 'macos-latest'
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      # --- ÉTAPE 3 : ARCHIVAGE DES ARTIFACTS ---
      - name: Upload Android APK
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk