name: KMP Build & Test

on:
  push:
    branches: [ master ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # On lance le workflow en parallèle sur Ubuntu (pour Android) et macOS (pour iOS)
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Gradle and Environment
        uses: ./.github/actions/gradle-setup

      # --- ÉTAPE 1 : TESTS UNITAIRES ---
      # Exécuté sur Ubuntu pour Android / Common
      - name: Run Android & Common Tests
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :shared:testDebugUnitTest

      # Exécuté sur macOS pour iOS (lance le simulateur pour exécuter les tests iOS)
      - name: Run iOS Tests
        if: matrix.os == 'macos-latest'
        run: ./gradlew :shared:iosX64Test

      # --- ÉTAPE 2 : COMPILATION BRUTE ---
      # Compilation de l'APK Android (génère un APK de debug)
      - name: Build Android APK
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :androidApp:assembleDebug

      # Compilation du framework iOS / vérification de la structure iOS
      - name: Build iOS Framework
        if: matrix.os == 'macos-latest'
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      # --- ÉTAPE 3 : ARCHIVAGE DES ARTIFACTS (Optionnel mais pratique) ---
      # Permet de récupérer l'APK directement depuis l'interface GitHub
      - name: Upload Android APK
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk