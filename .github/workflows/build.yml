name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Generate Dummy Framework
        run: ./gradlew :shared:generateDummyFramework

      - name: Install CocoaPods
        run: |
          cd iosApp
          pod install

      - name: Run unit tests
        # On lance uniquement les tests communs pour éviter le linker iOS si possible, 
        # ou on tente le test iOS avec les nouveaux flags.
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS simulator app
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Generate Dummy Framework
        run: ./gradlew :shared:generateDummyFramework

      - name: Install CocoaPods
        run: |
          cd iosApp
          pod install

      - name: Build iOS simulator app
        run: |
          xcodebuild build \
          -workspace iosApp/iosApp.xcworkspace \
          -configuration Debug \
          -scheme iosApp \
          -sdk iphonesimulator \
          -destination "platform=iOS Simulator,name=Any iOS Simulator Device" \
          -derivedDataPath ./build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_STYLE=Manual

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: iphonesimulator-app
          path: build/Build/Products/Debug-iphonesimulator/*.app
