name: 'Gradle Setup'
description: 'Sets up JDK, Gradle, and enables Konan caching for KMP'

inputs:
  gradle-encryption-key:
    description: 'Encryption key for Gradle cache'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # On utilise l'input de l'action composite au lieu du secret direct
        cache-encryption-key: ${{ inputs.gradle-encryption-key }}